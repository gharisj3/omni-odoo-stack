; Purpose: Odoo 19 configuration for production-like local and OCI deployments.

[options]
admin_passwd = ${ODOO_ADMIN_PASSWD}
db_host = ${ODOO_DB_HOST}
db_port = ${ODOO_DB_PORT}
db_user = ${ODOO_DB_USER}
db_password = ${ODOO_DB_PASSWORD}
db_name = ${ODOO_DB_NAME}
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons
proxy_mode = ${ODOO_PROXY_MODE}
http_port = ${ODOO_HTTP_PORT}
longpolling_port = ${ODOO_LONGPOLLING_PORT}
workers = ${ODOO_WORKERS}
list_db = ${ODOO_LIST_DB}
max_cron_threads = 2
limit_time_cpu = 120
limit_time_real = 240
limit_memory_soft = 2147483648
limit_memory_hard = 2684354560
log_level = ${ODOO_LOG_LEVEL}
logfile = /var/lib/odoo/odoo.log
data_dir = /var/lib/odoo
server_wide_modules = base,web
