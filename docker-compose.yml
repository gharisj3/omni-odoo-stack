# Purpose: Local and OCI deployment stack for Odoo, PostgreSQL, n8n, FastAPI middleware, and Nginx.

services:
  db:
    image: postgres:16
    container_name: omni-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - omni-net

  odoo:
    image: odoo:19
    container_name: omni-odoo
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOST: db
      PORT: ${ODOO_DB_PORT}
      USER: ${ODOO_DB_USER}
      PASSWORD: ${ODOO_DB_PASSWORD}
      POSTGRES_DB: ${ODOO_DB_NAME}
      ADMIN_PASSWD: ${ODOO_ADMIN_PASSWD}
      OMNI_API_KEY: ${OMNI_API_KEY}
      OMNI_AI_ENDPOINT: ${OMNI_AI_ENDPOINT}
      META_VERIFY_TOKEN: ${META_VERIFY_TOKEN}
      META_WHATSAPP_TOKEN: ${META_WHATSAPP_TOKEN}
      META_PHONE_NUMBER_ID: ${META_PHONE_NUMBER_ID}
      GROQ_API_KEY: ${GROQ_API_KEY}
    command: >
      sh -c "python3 -c \"import os, pathlib; template = pathlib.Path('/etc/odoo/odoo.conf').read_text(); pathlib.Path('/tmp/odoo.conf').write_text(os.path.expandvars(template))\" &&
      exec odoo -c /tmp/odoo.conf"
    volumes:
      - odoo-data:/var/lib/odoo
      - ./odoo/config/odoo.conf:/etc/odoo/odoo.conf:ro
      - ./odoo/addons:/mnt/extra-addons:ro
      - ./odoo-source:/opt/odoo-source:ro
    expose:
      - "8069"
      - "8072"
    networks:
      - omni-net

  ai-middleware:
    image: python:3.12-slim
    container_name: omni-ai
    restart: unless-stopped
    working_dir: /app
    env_file:
      - .env
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt &&
      uvicorn middleware.main:app --host 0.0.0.0 --port 8000"
    volumes:
      - ./ai:/app
    expose:
      - "8000"
    networks:
      - omni-net

  n8n:
    image: docker.n8n.io/n8nio/n8n:1.95.3
    container_name: omni-n8n
    restart: unless-stopped
    env_file:
      - .env
    environment:
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_RUNNERS_ENABLED: "true"
      GENERIC_TIMEZONE: Asia/Karachi
    volumes:
      - n8n-data:/home/node/.n8n
      - ./n8n/workflows:/data/imports:ro
    expose:
      - "5678"
    networks:
      - omni-net

  nginx:
    image: nginx:1.27-alpine
    container_name: omni-nginx
    restart: unless-stopped
    depends_on:
      - odoo
      - n8n
      - ai-middleware
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/letsencrypt:ro
      - ./nginx/acme:/var/www/certbot
    networks:
      - omni-net

networks:
  omni-net:
    driver: bridge

volumes:
  postgres-data:
  odoo-data:
  n8n-data:
